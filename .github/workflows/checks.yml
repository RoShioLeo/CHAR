name: Check converter
on:
  push:
    branches: [main, dev/blog-tools]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Python mappings
        run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: Check browser mappings
        run: node --test test/browser.test.cjs
